name: Validate ExamSathi

on:
  push:
    paths:
      - 'data.js'
      - 'app.js'
      - 'question-bank.js'
      - 'exam-catalog.js'
      - 'firebase-config.js'
      - 'sw.js'
      - 'question-banks/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/validate-question-banks.yml'
  pull_request:
    paths:
      - 'data.js'
      - 'app.js'
      - 'question-bank.js'
      - 'exam-catalog.js'
      - 'firebase-config.js'
      - 'sw.js'
      - 'question-banks/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/validate-question-banks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate app data and question banks
        run: npm run check
